name: Software tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }} / Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
        project: ['.', 'gen-1-dlib', 'gen-2-scrfd']
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '${{ matrix.project }}/requirements.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Run software regression tests
        run: python scripts/run_tests.py
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Check quality control authentication
        run: node tests/test_quality.js
      - name: Check enrollment button behavior
        run: node tests/test_enroll_ui.js
      - name: Check website behavior
        run: node tests/test_website.js
      - name: Check speech behavior
        run: node tests/test_speech.js
